name: Recover release site
run-name: Recover site v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already-published stable version; no builds or package publication"
        required: true
        type: string

concurrency:
  group: stable-release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'esengine/DeepSeek-Reasonix' && github.ref == 'refs/heads/main-v2' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate executable contracts and public access before approval
        run: |
          bash scripts/validate-release-control-plane.sh
          bash scripts/check-release-public-access.sh
      - name: Bind existing public tags to protected history
        id: identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_sha="$(git rev-parse "refs/tags/v$VERSION^{commit}")"
          git merge-base --is-ancestor "$source_sha" origin/main-v2
          bash scripts/release-candidate-tags.sh check recover "$VERSION" "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Re-read public package identities before approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_OPERATION: recover
          RELEASE_EXPECTED_SHA: ${{ steps.identity.outputs.source_sha }}
          CLI_TAG: v${{ inputs.version }}
          DESKTOP_TAG: desktop-v${{ inputs.version }}
          RELEASE_LEDGER_OUTPUT: ${{ runner.temp }}/site-recovery-preflight.json
        run: bash scripts/verify-stable-release-artifacts.sh
      - uses: actions/upload-artifact@v7
        with:
          name: site-recovery-preflight-${{ inputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-recovery-preflight.json
          retention-days: 90
          if-no-files-found: error

  sync:
    needs: preflight
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Recover only the website and verify public state again
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_OPERATION: recover
          RELEASE_EXPECTED_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_SITE_RECOVERY_ONLY: "true"
          RELEASE_LEDGER_OUTPUT: ${{ runner.temp }}/publication-ledger.json
        run: bash scripts/sync-release-site.sh
      - name: Preserve successful or incomplete recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-site-recovery-ledger-${{ inputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-ledger.json
          retention-days: 90
          if-no-files-found: error
