name: Deploy site
run-name: Deploy site ${{ inputs.release_version && format('v{0}', inputs.release_version) || github.sha }}${{ inputs.release_request && format(' [{0}]', inputs.release_request) || '' }}

on:
  push:
    branches: [main-v2]
    paths: ['site/**', 'release-notes/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional release version that owns this deployment"
        required: false
        default: ""
        type: string
      release_request:
        description: "Release workflow correlation ID (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main-v2' && github.ref_protected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.release_version != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: inputs.release_version != ''
        with:
          node-version: "22"
      - name: Recheck release ownership immediately before deployment
        if: inputs.release_version != ''
        env:
          VERSION: ${{ inputs.release_version }}
        run: test "$(bash scripts/observe-release-site.sh "$VERSION" recover)" = true
      - id: deploy
        uses: actions/deploy-pages@v5
