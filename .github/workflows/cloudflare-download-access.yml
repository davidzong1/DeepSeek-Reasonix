name: Inspect Cloudflare download access
run-name: Inspect public release manifest access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-download-access
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Inspect the public manifest and its challenge policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inspect-cloudflare-download-access.mjs
